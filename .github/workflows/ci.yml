name: ci
on:
  pull_request:
  push:
    branches: [main]

# The Definition of done from desert-peak-payload-supabase-prompt.md, in order.
# No secrets are needed for the checks; the DB tests run against a Postgres
# service with .env.test values. Production migrations run in the deploy job
# over the direct connection BEFORE the app deploys.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: desert_peak_test }
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_OPTIONS: --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Environment for CI (test values, no secrets)
        run: cp .env.test .env
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm verify:env
      - run: pnpm verify:data
      - run: pnpm verify:tokens
      - run: pnpm verify:parity
      - run: pnpm migrate
      - run: pnpm migrate:check
      - run: pnpm generate:types && git diff --exit-code -- src/payload-types.ts
      - run: pnpm test:access
      - run: pnpm test:tenancy
      - run: pnpm test:referrals
      - run: pnpm seed --dry-run
      - run: pnpm seed
      - run: pnpm build
      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Start the built site
        run: (pnpm start &) && npx wait-on http://localhost:3000/ -t 120000
      - run: pnpm test:db
      - run: pnpm test:rls
      - run: pnpm verify:routes
      - run: pnpm verify:seo
      - run: pnpm verify:redirects
      - run: pnpm verify:compliance
      - run: pnpm verify:uniqueness
      - run: pnpm test:revalidate
      - run: pnpm test:a11y
      - run: pnpm test:nojs
      - run: pnpm test:motion
      - run: pnpm test:quote-flow
      - run: pnpm test:visual
      - run: pnpm lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: evidence, path: "tests/e2e/report\ntests/lhci\ntests/visual/__screenshots__", retention-days: 30 }

  deploy-migrations:
    # Runs only on main, after verify, before Vercel builds production. Uses the
    # DIRECT/session connection, never the transaction pooler.
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate:status && pnpm migrate
        env:
          APP_ENV: production
          PAYLOAD_DATABASE_URI: ${{ secrets.PAYLOAD_DATABASE_URI }}
          PAYLOAD_DATABASE_URI_DIRECT: ${{ secrets.PAYLOAD_DATABASE_URI_DIRECT }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.desertpeakinsurance.com
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          DEFAULT_TENANT_ID: desert-peak
          REFERRAL_HASH_SALT: ${{ secrets.REFERRAL_HASH_SALT }}
