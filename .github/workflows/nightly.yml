name: nightly
on:
  schedule: [{ cron: "17 9 * * *" }]
  workflow_dispatch:
# Retention and backups (Phase 7): purge expired leads and quote sessions; take a logical dump to separate storage.
jobs:
  retention:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm leads:purge
        env:
          APP_ENV: production
          PAYLOAD_DATABASE_URI: ${{ secrets.PAYLOAD_DATABASE_URI }}
          PAYLOAD_DATABASE_URI_DIRECT: ${{ secrets.PAYLOAD_DATABASE_URI_DIRECT }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.desertpeakinsurance.com
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          DEFAULT_TENANT_ID: desert-peak
          REFERRAL_HASH_SALT: ${{ secrets.REFERRAL_HASH_SALT }}
      - name: Logical dump of the payload_cms schema to separate storage
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          pg_dump "$PAYLOAD_DATABASE_URI_DIRECT" --schema=payload_cms --no-owner --format=custom --file=payload_cms.dump
          echo "dump $(stat -c %s payload_cms.dump) bytes; upload to the backup bucket (aws s3 cp) once BACKUP_* secrets exist"
        env:
          PAYLOAD_DATABASE_URI_DIRECT: ${{ secrets.PAYLOAD_DATABASE_URI_DIRECT }}
