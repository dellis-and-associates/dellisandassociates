<!doctype html>
<meta charset="utf-8">
<title>Partner row test</title>
<!-- Drop licensed carrier logo files into ./carriers/ (git-ignored) and open this file. Carrier marks are never committed here. -->
<style>
  body { margin: 0; padding: 24px; background: #FAF4EC; font: 12px sans-serif; color: #605A52; }
  .row { display: flex; align-items: center; gap: 40px; background: #FEFBF8; border: 1px solid #DDD6CE; padding: 24px 32px; border-radius: 4px; margin-bottom: 16px; }
  .row img { height: 34px; }
  .row .dp { height: 44px; }
  .row .sep { width: 1px; height: 48px; background: #DDD6CE; }
  .gray { filter: grayscale(1); }
</style>
<p>Rename or edit the carrier file names below to match what is in <code>carriers/</code>. Size each carrier so its cap height is about 0.8 of the Desert Peak mark height; do not size by width.</p>
<div class="row"><img class="dp" src="../logo-horizontal.svg"><span class="sep"></span><img src="carriers/carrier-1.svg"><img src="carriers/carrier-2.svg"><img src="carriers/carrier-3.svg"><img src="carriers/carrier-4.svg"><img src="carriers/carrier-5.svg"></div>
<div class="row gray"><img class="dp" src="../logo-horizontal.svg"><span class="sep"></span><img src="carriers/carrier-1.svg"><img src="carriers/carrier-2.svg"><img src="carriers/carrier-3.svg"><img src="carriers/carrier-4.svg"><img src="carriers/carrier-5.svg"></div>
<div class="row"><img class="dp" src="../mark.svg"><span class="sep"></span><img src="carriers/carrier-1.svg"><img src="carriers/carrier-2.svg"><img src="carriers/carrier-3.svg"><img src="carriers/carrier-4.svg"><img src="carriers/carrier-5.svg"></div>
